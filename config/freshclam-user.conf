# Fixed minimal freshclam configuration for the unprivileged mw.clamav-update-signatures-user
# repair action (linux-host launcher, docs/malware.md). Managed by ahlikoding.com and satpamsiber.com
# from ahliweb.com.
#
# The engine passes --config-file=<this file> and --datadir=<USB>/reports/clamav, so nothing here
# depends on /etc/clamav/freshclam.conf. No UpdateLogFile (the system log directory is not writable
# by the desktop user), no DatabaseOwner, no DatabaseDirectory, no proxy and no credential.
DatabaseMirror database.clamav.net
ConnectTimeout 30
ReceiveTimeout 120
ScriptedUpdates yes
